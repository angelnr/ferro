name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Los runners comparten IP y Maven Central devuelve 429; usar el mirror de Google.
      FERRO_MAVEN_SETTINGS: config/maven/settings-ci.xml
    steps:
      - uses: actions/checkout@v4

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.cache/ferro/m2
          key: m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: m2-

      - name: Verificar backend (misma ruta que local)
        run: ./scripts/verify.sh --backend --ci

      - name: Subir evidencia y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-evidence
          if-no-files-found: warn
          path: |
            .harness/last-verify.txt
            .harness/logs/
            backend/target/surefire-reports/
            backend/target/site/jacoco/

  frontend:
    name: Frontend · Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FERRO_INSTALL: always
    steps:
      - uses: actions/checkout@v4

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.cache/ferro/npm
          key: npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-

      - name: Verificar frontend (misma ruta que local)
        run: ./scripts/verify.sh --frontend --ci

      - name: Subir evidencia y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-evidence
          if-no-files-found: warn
          path: |
            .harness/last-verify.txt
            .harness/logs/
            frontend/coverage/

  e2e:
    name: E2E · Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    env:
      CI: 1
      HOME: /root
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: npm ci
        working-directory: frontend

      - name: Ejecutar E2E
        run: npx playwright test
        working-directory: frontend

      - name: Subir reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          if-no-files-found: warn
          path: |
            frontend/playwright-report/
            frontend/test-results/

  lighthouse:
    name: Lighthouse · PWA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar y construir frontend
        run: npm ci && npm run build
        working-directory: frontend

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  secrets-and-docs:
    name: Secretos y documentación
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks (historial completo)
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            git /repo --redact --verbose --exit-code=1

      - name: Enlaces relativos de README y docs
        run: python3 scripts/check-docs.py

      - name: Invariantes del harness
        run: ./scripts/check-harness.sh
