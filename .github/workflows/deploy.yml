name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag de imagen ya publicada"
        required: true
        default: latest

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Publicar imagen API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ferro-api:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/ferro-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Desplegar por SSH
    runs-on: ubuntu-latest
    needs: build
    if: vars.DEPLOY_ENABLED == 'true'
    environment: production
    steps:
      - name: Desplegar compose
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/ferro
            git fetch --tags
            git checkout ${{ github.ref_name }}
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            IMAGE_TAG=${{ github.ref_name }} docker compose -f infra/docker-compose.prod.yml pull api
            IMAGE_TAG=${{ github.ref_name }} docker compose -f infra/docker-compose.prod.yml up -d
            curl -fsS http://127.0.0.1:8080/actuator/health/readiness
