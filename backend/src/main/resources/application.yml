server:
  port: 8080

spring:
  application:
    name: ferro-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/ferro}
    username: ${DB_USER:ferro}
    password: ${DB_PASSWORD:ferro}
  jpa:
    open-in-view: false
    hibernate:
      # M0: aún no hay entidades. Desde M1, 'validate' (nunca 'update').
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true
  mail:
    host: ${MAIL_HOST:127.0.0.1}
    port: ${MAIL_PORT:1025}

springdoc:
  api-docs:
    path: /api/api-docs
  swagger-ui:
    path: /api/docs
    operations-sorter: method

ferro:
  app:
    frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}
  email-verification:
    ttl: 24h
  mail:
    from: ${MAIL_FROM:no-reply@ferro.dev}
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-ferro-jwt-secret-change-me-32b}
      issuer: ferro
      access-ttl: 15m
    refresh:
      ttl: 30d
      cookie-secure: ${COOKIE_SECURE:false}
      cookie-same-site: ${COOKIE_SAME_SITE:Lax}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: info
    com.ferro: debug
