server:
  port: 8080

spring:
  application:
    name: ferro-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/ferro}
    username: ${DB_USER:ferro}
    password: ${DB_PASSWORD:ferro}
  jpa:
    open-in-view: false
    hibernate:
      # M0: aún no hay entidades. Desde M1, 'validate' (nunca 'update').
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: info
    com.ferro: debug
