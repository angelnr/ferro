logging:
  level:
    com.ferro: debug
    org.flywaydb: info

ferro:
  security:
    refresh:
      cookie-secure: false
      cookie-same-site: Lax
  mail:
    from: no-reply@ferro.local

spring:
  mail:
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

management:
  endpoint:
    health:
      show-details: always
