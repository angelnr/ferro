server:
  forward-headers-strategy: framework

logging:
  structured:
    format:
      console: logstash
  level:
    root: info
    com.ferro: info

ferro:
  security:
    jwt:
      secret: ${JWT_SECRET}
    refresh:
      cookie-secure: true
      cookie-same-site: None
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:https://ferro.vercel.app}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

spring:
  mail:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
