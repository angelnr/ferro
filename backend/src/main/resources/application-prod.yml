logging:
  level:
    root: info
    com.ferro: info

ferro:
  security:
    jwt:
      secret: ${JWT_SECRET}
    refresh:
      cookie-secure: true
      cookie-same-site: None
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:https://ferro.vercel.app}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
