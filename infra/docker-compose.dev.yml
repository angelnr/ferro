name: ferro-dev

services:
  postgres:
    image: postgres:18-alpine
    container_name: ferro-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ferro}
      POSTGRES_USER: ${POSTGRES_USER:-ferro}
      # Credencial solo para el Postgres local (127.0.0.1); producción la exige por entorno.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ferro} # ggignore
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ferro_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ferro} -d ${POSTGRES_DB:-ferro}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.34.0
    container_name: ferro-mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: ferro-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ferro_prometheus:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.7
    container_name: ferro-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-ferro}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ferro-overview.json
    ports:
      - "127.0.0.1:3003:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ferro_grafana:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  ferro_pgdata:
  ferro_prometheus:
  ferro_grafana:
